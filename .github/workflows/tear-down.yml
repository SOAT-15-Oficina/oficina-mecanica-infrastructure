name: Tear down

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente a destruir"
        type: choice
        options: [homolog, prod]
        default: homolog
      confirm:
        description: 'Digite "destroy" para confirmar'
        required: true
        type: string

concurrency:
  group: environment-lifecycle-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: sa-east-1
  ENVIRONMENT: ${{ inputs.environment }}
  SSM_PREFIX: /oficina-mecanica/${{ inputs.environment }}

jobs:
  check:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Check ref matches environment
        id: ref
        run: |
          case "$ENVIRONMENT" in
            prod)    expected=main ;;
            homolog) expected=hml ;;
            *)       echo "ambiente desconhecido: $ENVIRONMENT"; exit 1 ;;
          esac
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Ambiente '$ENVIRONMENT' se destroi a partir da branch '$expected',"
            echo "mas este run partiu de '$GITHUB_REF_NAME'."
            exit 1
          fi
          echo "ref=$expected" >> "$GITHUB_OUTPUT"

  destroy-services:
    needs: [check]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
      ORG: SOAT-15-Oficina
      REF: ${{ needs.check.outputs.ref }}
    steps:
      - name: Destroy services
        run: |
          echo "disparando destroy.yml em '$REF' para o ambiente '$ENVIRONMENT'"

          dispatch() {
            repo="$ORG/oficina-mecanica-$1"
            before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run destroy.yml --repo "$repo" --ref "$REF" >&2
            for _ in $(seq 1 30); do
              id="$(gh api "repos/$repo/actions/workflows/destroy.yml/runs?event=workflow_dispatch&branch=$REF&per_page=10" \
                --jq "[.workflow_runs[] | select(.created_at >= \"$before\")] | sort_by(.created_at) | last | .id // empty")"
              if [ -n "$id" ]; then echo "$id"; return 0; fi
              sleep 5
            done
            echo "nao encontrei o run disparado em $repo" >&2
            return 1
          }

          await() {
            repo="$ORG/oficina-mecanica-$1"; id="$2"
            echo "aguardando https://github.com/$repo/actions/runs/$id"
            for _ in $(seq 1 120); do
              state="$(gh api "repos/$repo/actions/runs/$id" --jq '.status + " " + (.conclusion // "-")')"
              case "$state" in
                "completed success") echo "$1: ok"; return 0 ;;
                completed*)          echo "$1: falhou ($state)" >&2; return 1 ;;
              esac
              sleep 15
            done
            echo "$1: timeout" >&2
            return 1
          }

          os_id="$(dispatch os-service)"
          await os-service "$os_id"

          billing_id="$(dispatch billing-service)"
          execution_id="$(dispatch execution-service)"
          await billing-service "$billing_id"
          await execution-service "$execution_id"

  destroy-platform:
    needs: [check, destroy-services]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Detach remaining target group bindings
        continue-on-error: true
        run: |
          CLUSTER="$(aws ssm get-parameter --name "${SSM_PREFIX}/eks_cluster_name" \
            --query Parameter.Value --output text 2>/dev/null || true)"
          NS="$(aws ssm get-parameter --name "${SSM_PREFIX}/kube_namespace" \
            --query Parameter.Value --output text 2>/dev/null || true)"
          if [ -n "$CLUSTER" ] && [ -n "$NS" ]; then
            aws eks update-kubeconfig --name "$CLUSTER"
            kubectl -n "$NS" delete targetgroupbinding --all --ignore-not-found --timeout=120s
          fi

      - name: Destroy platform
        env:
          TF_VAR_ses_verified_emails: "[]"
          TF_VAR_ses_sender_email: ${{ vars.TF_VAR_SES_SENDER_EMAIL }}
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
          TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY }}
          TF_VAR_datadog_enabled: ${{ vars.TF_VAR_DATADOG_ENABLED || 'true' }}
          TF_VAR_datadog_site: ${{ vars.TF_VAR_DATADOG_SITE || 'datadoghq.com' }}
        run: |
          export TF_VAR_environment="$ENVIRONMENT"
          terraform -chdir=platform init -input=false \
            -backend-config="${ENVIRONMENT}.s3.tfbackend"
          terraform -chdir=platform destroy -input=false -auto-approve -lock-timeout=30m

      - name: Verify nothing was left behind
        run: |
          LEFTOVERS=0
          check() {
            if [ "$2" != "0" ]; then echo "$1 restantes: $2"; LEFTOVERS=1; fi
          }

          check VPCs "$(aws ec2 describe-vpcs \
            --filters "Name=tag:Project,Values=oficina-mecanica" "Name=tag:Environment,Values=${ENVIRONMENT}" \
            --query 'length(Vpcs)' --output text)"

          check "Elastic IPs" "$(aws ec2 describe-addresses \
            --filters "Name=tag:Project,Values=oficina-mecanica" "Name=tag:Environment,Values=${ENVIRONMENT}" \
            --query 'length(Addresses)' --output text)"

          check "Clusters EKS" "$(aws eks list-clusters \
            --query "length(clusters[?@ == 'oficina-mecanica-${ENVIRONMENT}'])" --output text)"

          check "Instancias RDS" "$(aws rds describe-db-instances \
            --query "length(DBInstances[?starts_with(DBInstanceIdentifier, 'oficina-${ENVIRONMENT}-')])" --output text)"

          check "Tabelas DynamoDB" "$(aws dynamodb list-tables \
            --query "length(TableNames[?starts_with(@, 'oficina-${ENVIRONMENT}-')])" --output text)"

          check "Distribuicoes CloudFront" "$(aws cloudfront list-distributions \
            --query "length(DistributionList.Items[?Comment == 'oficina-mecanica-${ENVIRONMENT} - painel + API'] || \`[]\`)" --output text)"

          check "Parametros SSM" "$(aws ssm get-parameters-by-path --path "${SSM_PREFIX}/" \
            --query 'length(Parameters)' --output text)"

          if [ "$LEFTOVERS" = "1" ]; then
            echo "Recursos orfaos continuam gerando custo -- limpe manualmente."
            exit 1
          fi
          echo "Nada restante no ambiente '$ENVIRONMENT'."
