name: Bring up

# Sobe a camada efemera de UM ambiente e dispara o deploy dos tres repositorios
# de aplicacao nele. Manual: os ambientes sobem sob demanda, nao
# permanentemente.
#
# Duracao tipica: ~25-30 min do zero ate o ambiente atender requisicoes (EKS
# ~15min e RDS ~10min em paralelo, mais os tres deploys, migration e seed).
#
# Homologacao e producao sao stacks independentes na MESMA conta: prefixo de
# nome distinto, state distinto, roles distintas. O que decide qual delas sobe e
# o input `environment` -- e a branch de onde este workflow foi disparado
# precisa ser a do ambiente, senao o codigo aplicado nao e o que foi promovido.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente a subir"
        type: choice
        options: [homolog, prod]
        default: homolog
      seed:
        description: "Rodar o seed de dados de exemplo apos as migrations"
        type: boolean
        default: true

# Por ambiente: subir homologacao nao pode ficar na fila atras de producao, e
# vice-versa. O tear-down usa o MESMO grupo, para que subir e derrubar o mesmo
# ambiente nunca corram em paralelo.
concurrency:
  group: environment-lifecycle-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: sa-east-1
  ENVIRONMENT: ${{ inputs.environment }}
  SSM_PREFIX: /oficina-mecanica/${{ inputs.environment }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
    outputs:
      cluster: ${{ steps.outputs.outputs.cluster }}
      namespace: ${{ steps.outputs.outputs.namespace }}
      base_url: ${{ steps.outputs.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      # O ambiente e a branch andam juntos: `hml` e o que foi promovido para
      # homologacao, `main` o que foi promovido para producao. Subir producao a
      # partir de `hml` aplicaria codigo nao promovido -- e subir homologacao a
      # partir de `main` testaria algo que nunca passou por homologacao.
      - name: Check ref matches environment
        run: |
          case "$ENVIRONMENT" in
            prod)    expected=main ;;
            homolog) expected=hml ;;
            *)       echo "ambiente desconhecido: $ENVIRONMENT"; exit 1 ;;
          esac
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Ambiente '$ENVIRONMENT' se aplica a partir da branch '$expected',"
            echo "mas este run partiu de '$GITHUB_REF_NAME'."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Mesmo motivo do job apply-persistent em terraform.yml: <ambiente>.tfvars
      # e gitignored e nao existe no runner, e o default de ses_verified_emails
      # e `[]` -- aplicar sem estes valores esvaziaria o for_each e DESTRUIRIA as
      # identidades SES ja verificadas.
      #
      # Vale para os dois ambientes: mesmo onde a stack nao POSSUI as identidades
      # (manage_ses_identities = false), o remetente vazio viraria o marcador
      # "unset" no SSM e a API subiria sem conseguir enviar e-mail.
      - name: Check required inputs
        env:
          EMAILS: ${{ vars.TF_VAR_SES_VERIFIED_EMAILS }}
          SENDER: ${{ vars.TF_VAR_SES_SENDER_EMAIL }}
        run: |
          missing=""
          [ -n "$EMAILS" ] || missing="$missing TF_VAR_SES_VERIFIED_EMAILS"
          [ -n "$SENDER" ] || missing="$missing TF_VAR_SES_SENDER_EMAIL"
          if [ -n "$missing" ]; then
            echo "Variables ausentes no repositorio:$missing"
            echo "Aplicar sem elas destruiria as identidades SES verificadas."
            exit 1
          fi

      - name: Check Datadog credentials
        env:
          DD_ENABLED: ${{ vars.TF_VAR_DATADOG_ENABLED }}
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
        run: |
          if [ "${DD_ENABLED:-true}" = "false" ]; then
            echo "Datadog desligado neste ambiente por TF_VAR_DATADOG_ENABLED=false."
            exit 0
          fi
          missing=""
          [ -n "$DD_API_KEY" ] || missing="$missing DATADOG_API_KEY"
          [ -n "$DD_APP_KEY" ] || missing="$missing DATADOG_APP_KEY"
          if [ -n "$missing" ]; then
            echo "Secrets ausentes no GitHub Environment:$missing"
            echo "Cadastre-os, ou desligue o Datadog neste ambiente com a"
            echo "variable TF_VAR_DATADOG_ENABLED=false (ciente de que isso"
            echo "destroi os paineis e monitores ja criados)."
            exit 1
          fi

      # A camada persistente precisa existir antes: a efemera le o contrato de
      # SSM que ela publica.
      #
      # Em cada camada, o -backend-config escolhe o STATE do ambiente e o
      # TF_VAR_environment escolhe o que sera escrito nele. Os dois saem do mesmo
      # $ENVIRONMENT -- e o que impede aplicar um ambiente sobre o state do outro.
      - name: Apply persistent layer
        env:
          TF_VAR_ses_verified_emails: ${{ vars.TF_VAR_SES_VERIFIED_EMAILS }}
          TF_VAR_ses_sender_email: ${{ vars.TF_VAR_SES_SENDER_EMAIL }}
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
          TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY }}
          TF_VAR_datadog_enabled: ${{ vars.TF_VAR_DATADOG_ENABLED || 'true' }}
          TF_VAR_datadog_site: ${{ vars.TF_VAR_DATADOG_SITE || 'datadoghq.com' }}
        run: |
          export TF_VAR_environment="$ENVIRONMENT"
          terraform -chdir=persistent init -input=false \
            -backend-config="${ENVIRONMENT}.s3.tfbackend"
          terraform -chdir=persistent apply -input=false -auto-approve -lock-timeout=10m

      # As chaves do Datadog aqui sao do teste sintetico, que vive nesta camada
      # (ephemeral/datadog_synthetics.tf). O agente no cluster nao as usa: le a
      # API key do Secrets Manager.
      - name: Apply ephemeral layer
        env:
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
          TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY }}
        run: |
          export TF_VAR_environment="$ENVIRONMENT"
          terraform -chdir=ephemeral init -input=false \
            -backend-config="${ENVIRONMENT}.s3.tfbackend"
          terraform -chdir=ephemeral apply -input=false -auto-approve -lock-timeout=30m

      - name: Export outputs
        id: outputs
        run: |
          BASE_URL="$(aws ssm get-parameter --name "${SSM_PREFIX}/public_base_url" --query Parameter.Value --output text)"

          {
            echo "cluster=$(terraform -chdir=ephemeral output -raw eks_cluster_name)"
            echo "namespace=$(aws ssm get-parameter --name "${SSM_PREFIX}/kube_namespace" --query Parameter.Value --output text)"
            echo "base_url=$BASE_URL"
          } >> "$GITHUB_OUTPUT"

          # A URL era impressa pelo job `verify`, que saiu daqui. Quem dispara um
          # bring-up ainda precisa saber onde o ambiente ficou.
          {
            echo "### Ambiente \`$ENVIRONMENT\`"
            echo
            echo "- Painel e API: $BASE_URL"
            echo "- Healthcheck: \`$BASE_URL/api/ping\`"
            echo
            echo "O 200 em \`/api/ping\` so aparece depois do rollout do -monolith."
            echo "A disponibilidade continua sendo acompanhada pelo teste sintetico"
            echo "do Datadog (ephemeral/datadog_synthetics.tf), que checa a cada 5 min."
          } >> "$GITHUB_STEP_SUMMARY"

  # Cada repositorio de aplicacao e dono do proprio deploy. O bring-up apenas
  # os aciona, na ordem em que dependem uns dos outros.
  deploy-applications:
    needs: [apply]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
      ORG: SOAT-15-Oficina
    steps:
      # Nao use `gh run watch`: ele pede annotations, que exigem a permissao
      # `checks:read` -- impossivel de conceder num PAT fine-grained. O polling
      # abaixo usa so a API de runs, coberta por `actions: read`.
      #
      # Tambem nao pegue "o run mais recente" depois de um sleep: se houver
      # outro run de ci.yml na fila, observa-se o errado. Aqui o run e casado
      # pelo timestamp de criacao, posterior ao dispatch.
      - name: Deploy applications
        run: |
          # A branch e o unico jeito de dizer a um repositorio de aplicacao qual
          # ambiente ele deve alvejar: o ci.yml de la deriva ambiente, prefixo do
          # SSM e GitHub Environment de `github.ref_name`. Um dispatch na branch
          # errada faz o deploy no ambiente errado -- por isso ela sai do mesmo
          # $ENVIRONMENT que ja validamos contra o ref deste run.
          case "$ENVIRONMENT" in
            prod)    REF=main ;;
            homolog) REF=hml ;;
            *)       echo "ambiente desconhecido: $ENVIRONMENT"; exit 1 ;;
          esac
          echo "disparando deploys em '$REF' para o ambiente '$ENVIRONMENT'"

          dispatch() {
            repo="$ORG/oficina-mecanica-$1"
            before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run ci.yml --repo "$repo" --ref "$REF" >&2
            for _ in $(seq 1 30); do
              id="$(gh api "repos/$repo/actions/runs?event=workflow_dispatch&branch=$REF&per_page=10" \
                --jq "[.workflow_runs[] | select(.created_at >= \"$before\")] | sort_by(.created_at) | last | .id // empty")"
              if [ -n "$id" ]; then echo "$id"; return 0; fi
              sleep 5
            done
            echo "nao encontrei o run disparado em $repo" >&2
            return 1
          }

          await() {
            repo="$ORG/oficina-mecanica-$1"; id="$2"
            echo "aguardando https://github.com/$repo/actions/runs/$id"
            for _ in $(seq 1 120); do
              state="$(gh api "repos/$repo/actions/runs/$id" --jq '.status + " " + (.conclusion // "-")')"
              case "$state" in
                "completed success") echo "$1: ok"; return 0 ;;
                completed*)          echo "$1: falhou ($state)" >&2; return 1 ;;
              esac
              sleep 15
            done
            echo "$1: timeout" >&2
            return 1
          }

          # Sempre por atribuicao, nunca `await x "$(dispatch x)"`: sob set -e
          # a falha de uma substituicao de comando usada como ARGUMENTO nao
          # aborta o script -- seguiria com o corpo do erro no lugar do id.
          # Numa atribuicao, o status da substituicao vira o status do comando
          # e o set -e pega.

          # O monolito primeiro e sozinho: ele roda as migrations que criam a
          # tabela `users`, sem a qual a Lambda de autenticacao nao funciona.
          monolith_id="$(dispatch monolith)"
          await monolith "$monolith_id"

          serverless_id="$(dispatch serverless)"
          frontend_id="$(dispatch frontend)"
          await serverless "$serverless_id"
          await frontend "$frontend_id"
