name: Terraform

on:
  pull_request:
    branches: [main, hml]
    paths-ignore: ["**/*.md", "docs/adr/**", "local/**"]
  push:
    branches: [main, hml]
    paths-ignore: ["**/*.md", "docs/adr/**", "local/**"]

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TF_VERSION: "1.9.5"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [bootstrap, platform]
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo rhysd/actionlint:latest

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform -chdir=${{ matrix.layer }} fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=${{ matrix.layer }} init -backend=false -input=false
          terraform -chdir=${{ matrix.layer }} validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.52.0

      - name: TFLint
        run: |
          tflint --init
          tflint --chdir=${{ matrix.layer }} --format compact
