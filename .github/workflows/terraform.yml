name: Terraform

# Dois ambientes, uma regra: a BRANCH escolhe o destino.
#
#   hml  -> homologacao (/oficina-mecanica/homolog, GitHub Environment homolog)
#   main -> producao    (/oficina-mecanica/prod,    GitHub Environment production)
#
# Nao ha nada aqui que mande em qual ambiente aplicar: o par branch->ambiente e
# a unica fonte, e a trust policy do OIDC (persistent/oidc.tf) o repete do lado
# da AWS. Um push em `hml` nao consegue credencial de producao nem se o job
# pedir o ambiente errado.
on:
  pull_request:
    branches: [main, hml]
    paths-ignore: ["**/*.md", "docs/adr/**", "local/**"]
  push:
    branches: [main, hml]
    paths-ignore: ["**/*.md", "docs/adr/**", "local/**"]

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: sa-east-1

jobs:
  # fmt, validate e tflint rodam nas tres camadas, em paralelo.
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [bootstrap, persistent, ephemeral]
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo rhysd/actionlint:latest

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform -chdir=${{ matrix.layer }} fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=${{ matrix.layer }} init -backend=false -input=false
          terraform -chdir=${{ matrix.layer }} validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.52.0

      - name: TFLint
        run: |
          tflint --init
          tflint --chdir=${{ matrix.layer }} --format compact

  # O plan comenta no PR para o diff de infraestrutura ser revisado ANTES de
  # existir. Nao aplica nada.
  # Nao existe job de `plan` em PR. Todo passo dele precisaria de credencial AWS
  # (o `init` usa backend S3 e o `plan` fala com a API), e a unica role deste
  # repositorio tem AdministratorAccess numa conta que hospeda outro projeto em
  # producao. Liberar `pull_request` na trust policy dela significaria que
  # qualquer PR executa workflow com admin na conta -- decisao do time foi nao
  # liberar.
  #
  # O que sobra em PR e o job `validate` (fmt, validate e tflint nas tres
  # camadas), que roda sem nenhuma credencial. Para ter plan em PR de novo, o
  # caminho e uma segunda role so-leitura, confiando em
  # `repo:<org>/<repo>:pull_request`, e nao afrouxar a role de admin.

  # Apply so em merge para main, e apenas na camada PERSISTENTE. A camada
  # efemera e aplicada pelo workflow bring-up, sob demanda.
  apply-persistent:
    if: github.event_name == 'push'
    needs: [validate]
    runs-on: ubuntu-latest
    # `hml` e a unica branch que nao e producao entre os gatilhos de push acima,
    # entao o fallback e seguro.
    environment: ${{ github.ref_name == 'hml' && 'homolog' || 'production' }}
    steps:
      - uses: actions/checkout@v4

      # Traduz a branch para o nome do ambiente usado pelo Terraform, pelo SSM e
      # pelos arquivos de backend. Um `case` explicito em vez de expressao: se
      # alguem adicionar uma branch ao gatilho e esquecer deste mapa, o job para
      # aqui em vez de aplicar no ambiente errado.
      - name: Resolve target environment
        run: |
          case "$GITHUB_REF_NAME" in
            main) ENVIRONMENT=prod ;;
            hml)  ENVIRONMENT=homolog ;;
            *)
              echo "branch $GITHUB_REF_NAME nao mapeia para nenhum ambiente"
              exit 1
              ;;
          esac
          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # As entradas da camada persistente vivem em <ambiente>.tfvars, que e
      # gitignored e nao existe no runner. Sem elas o Terraform usa os DEFAULTS -- e o
      # default de ses_verified_emails e `[]`, o que esvazia o for_each e
      # DESTROI as identidades SES ja verificadas. Por isso os valores chegam
      # por TF_VAR_* e o job aborta antes do apply se faltarem.
      - name: Check required inputs
        env:
          EMAILS: ${{ vars.TF_VAR_SES_VERIFIED_EMAILS }}
          SENDER: ${{ vars.TF_VAR_SES_SENDER_EMAIL }}
        run: |
          missing=""
          [ -n "$EMAILS" ] || missing="$missing TF_VAR_SES_VERIFIED_EMAILS"
          [ -n "$SENDER" ] || missing="$missing TF_VAR_SES_SENDER_EMAIL"
          if [ -n "$missing" ]; then
            echo "Variables ausentes no repositorio:$missing"
            echo "Aplicar sem elas destruiria as identidades SES verificadas."
            exit 1
          fi

      # O -backend-config escolhe o STATE do ambiente e o TF_VAR_environment
      # escolhe o que sera escrito nele. Os dois vem do mesmo $ENVIRONMENT: e o
      # que impede aplicar a configuracao de um ambiente sobre o state do outro.
      - name: Apply
        env:
          TF_VAR_ses_verified_emails: ${{ vars.TF_VAR_SES_VERIFIED_EMAILS }}
          TF_VAR_ses_sender_email: ${{ vars.TF_VAR_SES_SENDER_EMAIL }}
        run: |
          export TF_VAR_environment="$ENVIRONMENT"
          terraform -chdir=persistent init -input=false \
            -backend-config="${ENVIRONMENT}.s3.tfbackend"
          terraform -chdir=persistent apply -input=false -auto-approve -lock-timeout=5m
