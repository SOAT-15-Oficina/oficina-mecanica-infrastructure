# Temporario: imprime apenas as claims de identidade do token OIDC (sub, aud,
# iss) para conferir o formato que o GitHub emite. Nao imprime o token.
name: Debug OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString('utf8')
            );
            core.info('sub = ' + payload.sub);
            core.info('aud = ' + payload.aud);
            core.info('iss = ' + payload.iss);
