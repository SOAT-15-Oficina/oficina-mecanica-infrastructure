name: oficina-mecanica-local

x-aws-local: &aws-local
  AWS_DEFAULT_REGION: sa-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

x-email: &email
  EMAIL_PROVIDER: mailhog
  EMAIL_HOST: mailhog
  EMAIL_PORT: "1025"
  EMAIL_FROM: oficina@workshop.local

x-service-common: &service-common
  SERVER_ENVIRONMENT: development
  SERVER_PORT: "8080"
  APP_BASE_URL: http://localhost:${GATEWAY_PORT:-8080}/api
  JWT_SECRET_KEY: local-dev-secret
  MESSAGING_POLL_WAIT: 5s
  OUTBOX_POLL_INTERVAL: 500ms
  DD_ENV: ""
  DD_TRACE_ENABLED: "false"

x-os-database: &os-database
  DATABASE_HOST: os-db
  DATABASE_PORT: "5432"
  DATABASE_NAME: os
  DATABASE_USER: os
  DATABASE_PASSWORD: os-local
  DATABASE_MAX_CONNECTIONS: "5"

x-billing-database: &billing-database
  DATABASE_HOST: billing-db
  DATABASE_PORT: "5432"
  DATABASE_NAME: billing
  DATABASE_USER: billing
  DATABASE_PASSWORD: billing-local
  DATABASE_MAX_CONNECTIONS: "5"

x-os-build: &os-build
  context: ${OS_SERVICE_CONTEXT:-../../oficina-mecanica-monolith}
  dockerfile: Dockerfile

x-billing-build: &billing-build
  context: ../../oficina-mecanica-billing-service
  dockerfile: Dockerfile

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../oficina-mecanica-frontend:/usr/share/nginx/html:ro
    depends_on:
      - lambda-shim
      - os-service
      - billing
      - execution

  lambda-shim:
    image: node:22-alpine
    command: ["node", "/app/server.mjs"]
    working_dir: /app
    volumes:
      - ./lambda-shim:/app:ro
    environment:
      RIE_URL: http://lambda:8080/2015-03-31/functions/function/invocations
    depends_on:
      - lambda

  lambda:
    build:
      context: ../../oficina-mecanica-serverless
      dockerfile: Dockerfile
    environment:
      OS_INTERNAL_BASE_URL: http://os-service:8080
      INTERNAL_SERVICE_TOKEN: local-internal-token
      JWT_SECRET_KEY: local-dev-secret
    depends_on:
      - os-service

  localstack:
    image: localstack/localstack:4.4
    ports:
      - "4580:4566"
    environment:
      SERVICES: sqs,sns,dynamodb
      AWS_DEFAULT_REGION: sa-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(available\\|running\\)\"'"]
      interval: 5s
      timeout: 5s
      retries: 30

  localstack-init:
    image: localstack/localstack:4.4
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      <<: *aws-local
    volumes:
      - ./localstack/init.sh:/init/init.sh:ro
    depends_on:
      localstack:
        condition: service_healthy

  os-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: os
      POSTGRES_PASSWORD: os-local
      POSTGRES_DB: os
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U os -d os"]
      interval: 5s
      timeout: 5s
      retries: 10

  billing-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing-local
      POSTGRES_DB: billing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"

  mpfake:
    build:
      <<: *billing-build
      target: mpfake
    ports:
      - "8095:8095"
    environment:
      PORT: "8095"
      MPFAKE_WEBHOOK_URL: http://billing:8080/billing/webhooks/mercadopago
      MERCADOPAGO_POS_EXTERNAL_ID: OFICINAMATRIZPOS01
      MERCADOPAGO_WEBHOOK_SECRET: local-webhook-secret

  os-migrate:
    build: *os-build
    command: ["migrate"]
    environment:
      <<: *os-database
      JWT_SECRET_KEY: local-dev-secret
    depends_on:
      os-db:
        condition: service_healthy

  billing-migrate:
    build:
      <<: *billing-build
      target: release-stage
    command: ["migrate"]
    environment:
      <<: *billing-database
    depends_on:
      billing-db:
        condition: service_healthy

  os-service:
    build: *os-build
    environment:
      <<: [*service-common, *aws-local, *os-database, *email]
      MESSAGING_INBOX_QUEUE_URL: http://localstack:4566/000000000000/os-inbox.fifo
      BILLING_INBOX_QUEUE_URL: http://localstack:4566/000000000000/billing-inbox.fifo
      EXECUTION_INBOX_QUEUE_URL: http://localstack:4566/000000000000/execution-inbox.fifo
      INTERNAL_SERVICE_TOKEN: local-internal-token
      SAGA_TICK: ${SAGA_TICK:-1s}
      SAGA_COMMAND_TIMEOUT: ${SAGA_COMMAND_TIMEOUT:-30s}
      SAGA_MAX_ATTEMPTS: ${SAGA_MAX_ATTEMPTS:-5}
      SAGA_APPROVAL_TIMEOUT: ${SAGA_APPROVAL_TIMEOUT:-168h}
      SAGA_PAYMENT_TIMEOUT: ${SAGA_PAYMENT_TIMEOUT:-48h}
      DEFAULT_BRANCH: MATRIZ
      DD_SERVICE: os-service
    depends_on:
      os-migrate:
        condition: service_completed_successfully
      localstack-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started

  billing:
    build:
      <<: *billing-build
      target: release-stage
    environment:
      <<: [*service-common, *aws-local, *billing-database, *email]
      MESSAGING_INBOX_QUEUE_URL: http://localstack:4566/000000000000/billing-inbox.fifo
      MESSAGING_EVENTS_TOPIC_ARN: arn:aws:sns:sa-east-1:000000000000:billing-events.fifo
      MERCADOPAGO_BASE_URL: http://mpfake:8095
      MERCADOPAGO_ACCESS_TOKEN: TEST-local-access-token
      MERCADOPAGO_WEBHOOK_SECRET: local-webhook-secret
      MERCADOPAGO_POS_EXTERNAL_ID: OFICINAMATRIZPOS01
      PAYMENT_EXPIRATION: ${PAYMENT_EXPIRATION:-48h}
      DD_SERVICE: billing-service
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      localstack-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
      mpfake:
        condition: service_started

  execution:
    build:
      context: ../../oficina-mecanica-execution-service
      dockerfile: Dockerfile
    environment:
      <<: [*service-common, *aws-local]
      MESSAGING_INBOX_QUEUE_URL: http://localstack:4566/000000000000/execution-inbox.fifo
      MESSAGING_EVENTS_TOPIC_ARN: arn:aws:sns:sa-east-1:000000000000:execution-events.fifo
      DYNAMODB_TABLE_NAME: execution-tickets
      DD_SERVICE: execution-service
    depends_on:
      localstack-init:
        condition: service_completed_successfully
