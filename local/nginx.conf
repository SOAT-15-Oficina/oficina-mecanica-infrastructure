# Replica localmente o roteamento que o CloudFront faz em producao:
#
#   /*      -> painel estatico (bucket S3 em producao)
#   /api/*  -> API Gateway, que por sua vez divide entre Lambda e monolito
#
# O prefixo /api e removido antes de chegar na origem -- e o que a CloudFront
# Function `strip_api_prefix` faz la. Por isso o monolito continua servindo
# /customers e a Lambda continua servindo /auth/login, sem saber que existe um
# /api na frente.
#
# Consequencia pratica: local e producao tem as MESMAS URLs, e o front nao
# precisa de configuracao condicional.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Mais especifica que /api/, entao ganha a resolucao do nginx.
    location /api/auth/ {
        proxy_pass http://lambda-shim:8080/auth/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
